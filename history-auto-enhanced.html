<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배합 이력</title><style>body{margin:0;background:linear-gradient(135deg,#f5f9fc,#eef5fa);color:#10243b;font-family:Arial,"Malgun Gothic",sans-serif}header{background:#fff;border-bottom:1px solid #dce3eb;padding:23px 5%;font-size:21px;font-weight:bold;color:#082b50}main{width:min(1120px,92vw);margin:40px auto}.tag{font-size:11px;letter-spacing:2px;color:#bb4b1c;font-weight:bold}h1{font-size:34px}.groups{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.groups .group{transition:.18s ease}.groups .group:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(15,75,110,.08)}.group{background:#fff;border:2px solid #d2dce7;border-radius:9px;padding:15px 18px;cursor:pointer}.group.active{border-color:#0d477d;background:#eaf4ff}.group b,.group span{display:block}.group span{font-size:12px;color:#718196}.card{background:rgba(255,255,255,.96);border:1px solid #d2dce7;border-radius:14px;padding:18px;margin-top:16px;box-shadow:0 8px 20px rgba(24,67,98,.06)}.row{position:relative;display:grid;grid-template-columns:44px 1fr 1.1fr 1fr 1fr 1fr 1fr 1fr;align-items:center;padding:11px 10px;border-bottom:1px solid #edf1f5;text-align:center;cursor:pointer;font-size:13px;min-height:48px}.row:not(.head):nth-child(even){background:#f8fbfd}.row:not(.head):hover{background:#eaf5fb}.row.head{font-size:12px;letter-spacing:.3px}.row:hover,.row.selected{background:#eaf4ff}.row.head:hover{background:#082b50;color:#fff}.head{background:#082b50;color:#fff;font-weight:bold;cursor:default}.check-delete{display:none;margin:0 0 12px;padding:8px 13px;border:0;border-radius:8px;background:#fff0f0;color:#c43e4d;font-weight:bold;cursor:pointer}.history-check{width:17px;height:17px;accent-color:#0b6fb8;cursor:pointer}.check-delete.visible{display:inline-block}.safe{color:#10243b}.warn{color:#10243b}.ret-use{color:#1266c7}.risk-high{color:#d94152}.ret-use{color:#1266c7}.detail{display:none;margin-top:18px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fact{background:#f6f8fb;padding:13px;border-radius:8px}.fact small{display:block;color:#718196;font-size:11px;margin-bottom:7px}.fact b{font-size:17px}.cycle{border:1px solid #d2dce7;border-radius:8px;margin-top:14px;overflow:hidden}.cycle h3{margin:0;padding:12px 15px;background:#eef3f8;font-size:15px}.batch{display:grid;grid-template-columns:repeat(6,1fr);padding:13px;text-align:center;border-top:1px solid #e7edf2}.batch small{display:block;color:#718196;font-size:10px;margin-bottom:5px}.notice{margin-top:14px;background:#eaf4ff;color:#1761b7;padding:13px;border-radius:8px;line-height:1.6;font-size:13px}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e5ebf1}.detail-head h2{margin:0;font-size:22px}.edit-open{flex:0 0 auto;margin:0;padding:7px 14px;line-height:1;font-size:12px;border:0;border-radius:7px;background:#1266a5;color:#fff;font-weight:bold;cursor:pointer}.edit-box{display:none;margin-top:14px;padding:15px;border:1px solid #d2dce7;border-radius:9px;background:#fff}.edit-box h3{margin:0 0 12px;font-size:15px}.edit-box label{display:block;color:#718196;font-size:11px;margin:9px 0 5px}.edit-box select,.edit-box textarea{width:100%;padding:9px;border:1px solid #d2dce7;border-radius:7px;font:inherit;box-sizing:border-box}.edit-box textarea{height:70px;resize:vertical}.edit-save{display:block;margin:14px 0 0 auto;padding:10px 18px;border:0;border-radius:7px;background:#1266a5;color:#fff;font-weight:bold;cursor:pointer}@media(max-width:750px){.facts{grid-template-columns:repeat(2,1fr)}.card{overflow:auto}.row{min-width:700px}.detail{min-width:700px}}</style></head><body><header>AI 스마트 믹싱 · 배합 이력</header><main><div class="tag">작업명별 전체 기록</div><h1>배합 이력</h1><p style="color:#718196">작업일지에서 저장한 작업과 등록된 작업 이력이 함께 표시됩니다.</p><div class="groups" id="groups"></div><div class="card"><h2 id="title">전체 배합 이력</h2><section class="detail" id="detail"></section><button class="check-delete" id="deleteSelected">선택 삭제</button><div id="list"></div></div></main><script>const samples=[{date:'2026.08.01',temperature:32,humidity:76,job:'래들 바닥',material:'고알루미나 캐스터블',amount:3500,worker:'이민호',outcome:'조건 변경 후 완료',retarder:'2회 사용',memo:'1차 사이클은 500kg·500kg·250kg으로 적재했다. 1차 믹싱 완료 후 호퍼 대기시간이 12분으로 예상되어 1차·2차 믹싱 시 지연제를 함께 투입했다. 3차 사이클은 500kg·500kg으로 진행했고, 전체 적재 완료 후 즉시 작업을 시작했다.'},{date:'2026.07.31',temperature:28,humidity:61,job:'승온 버너',material:'마그네시아계 내화물',amount:1750,worker:'박지훈',outcome:'정상 작업 완료',retarder:'미사용',memo:'1차 사이클 1,250kg, 2차 사이클 500kg으로 작업했다. 작업장 온도와 습도가 안정적이었고 회차별 호퍼 대기시간이 짧아 지연제는 투입하지 않았다.'},{date:'2026.07.28',temperature:30,humidity:72,job:'래들 벽체',material:'저시멘트 캐스터블',amount:2500,worker:'김현수',outcome:'정상 작업 완료',retarder:'1회 사용',memo:'1차 믹싱 후 다음 믹싱과 적재를 진행하는 동안 대기시간이 발생했다. 1차 회차에만 지연제를 믹싱 중 함께 투입했으며, 2차 사이클은 별도 조건 변경 없이 완료했다.'},{date:'2026.07.25',temperature:26,humidity:58,job:'턴디쉬 카바',material:'저시멘트 캐스터블',amount:1250,worker:'홍길동',outcome:'정상 작업 완료',retarder:'미사용',memo:'500kg·500kg·250kg 순서로 믹싱했다. 각 회차의 권장 수분량을 따로 투입했고, 3차 믹싱 완료 후 호퍼 적재 상태를 확인하고 작업을 시작했다.'},{date:'2026.07.20',temperature:34,humidity:81,job:'래들 바닥',material:'고알루미나 캐스터블',amount:3250,worker:'이민호',outcome:'조건 변경 후 완료',retarder:'2회 사용',memo:'총 3,250kg을 1,250kg·1,250kg·750kg으로 나눠 작업했다. 2차 사이클에서 호퍼 대기시간이 길어져 해당 사이클의 믹싱 시 지연제를 투입했다.'}];let saved=JSON.parse(localStorage.getItem('mixingLogs')||'[]').map(x=>({...x,amount:Number(x.amount)})),deleted=JSON.parse(localStorage.getItem('deletedHistory')||'[]'),historyKey=x=>x.date+'|'+x.job+'|'+x.amount,data=[...saved,...samples].filter(x=>!deleted.includes(historyKey(x))),current='전체';let historyEdits=JSON.parse(localStorage.getItem('historyEdits')||'{}');data.forEach(v=>Object.assign(v,historyEdits[historyKey(v)]||{}));const $=id=>document.getElementById(id);function groups(){let names=['전체','래들 벽체','래들 바닥','턴디쉬 카바','승온 버너'];$('groups').innerHTML=names.map(n=>'<button class="group '+(n===current?'active':'')+'" data-job="'+n+'"><b>'+n+'</b><span>'+ (n==='전체'?data.length:data.filter(x=>x.job===n).length)+'건</span></button>').join('');document.querySelectorAll('.group').forEach(b=>b.onclick=()=>{current=b.dataset.job;groups();list()})}function list(){let arr=current==='전체'?data:data.filter(x=>x.job===current);$('title').textContent=current+' 배합 이력';$('list').innerHTML='<div class="row head"><div>선택</div><div>작업일</div><div>작업명</div><div>총 투입량</div><div>온도</div><div>습도</div><div>지연제</div><div>작업 결과</div></div>'+arr.map((r,i)=>'<div class="row" data-i="'+i+'"><input class="history-check" type="checkbox" data-i="'+i+'"><div>'+r.date+'</div><div>'+r.job+'</div><div>'+r.amount.toLocaleString()+'kg</div><div>'+(r.temperature??31)+'℃</div><div>'+(r.humidity??78)+'%</div><div class="warn">'+r.retarder+'</div><div class="safe">'+r.outcome+'</div></div>').join('');document.querySelectorAll('.row[data-i]').forEach(x=>x.onclick=e=>{if(e.target.classList.contains('history-check'))return;document.querySelectorAll('.row[data-i]').forEach(r=>r.classList.remove('selected'));x.classList.add('selected');detail(arr[+x.dataset.i]);document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('.history-check').forEach(x=>x.onchange=()=>{document.getElementById('deleteSelected').classList.toggle('visible',document.querySelectorAll('.history-check:checked').length>0)});document.getElementById('deleteSelected').onclick=()=>{let selected=[...document.querySelectorAll('.history-check:checked')].map(x=>arr[+x.dataset.i]);if(!selected.length)return;selected.forEach(v=>{let k=historyKey(v);if(!deleted.includes(k))deleted.push(k)});localStorage.setItem('deletedHistory',JSON.stringify(deleted));data=data.filter(v=>!selected.includes(v));list()};$('detail').style.display='none'}function detail(r){detailRecord=r;let base=r.material.includes('고알루미나')?.045:r.material.includes('마그네시아')?.065:.052,batches=r.batches||[],remain=r.amount;if(!batches.length){let n=1;while(remain>0){let s=Math.min(500,remain);batches.push({round:n++,plannedAmount:s,actualWater:s*base,actualMix:s===250?4:5,hopperWait:0,aiRetarder:'미사용',actualRetarder:'미사용'});remain-=s}}let cycles=[],cycle=[],total=0;batches.forEach(b=>{let size=Number(b.plannedAmount||b.s||0);if(total&&total+size>1500){cycles.push(cycle);cycle=[];total=0}cycle.push(b);total+=size});if(cycle.length)cycles.push(cycle);$('detail').style.display='block';$('detail').innerHTML='<div class="detail-head"><h2>상세 작업 내용</h2><button class="edit-open" onclick="openEditDetail()">수정</button></div><div class="facts"><div class="fact"><small>작업명</small><b>'+r.job+'</b></div><div class="fact"><small>내화물 종류</small><b>'+r.material+'</b></div><div class="fact"><small>작업자</small><b>'+r.worker+'</b></div><div class="fact"><small>총 투입량</small><b>'+r.amount.toLocaleString()+'kg</b></div><div class="fact"><small>작업장 온도</small><b>'+(r.temperature??31)+'℃</b></div><div class="fact"><small>상대습도</small><b>'+(r.humidity??78)+'%</b></div></div>'+cycles.map((c,i)=>'<div class="cycle"><h3>'+(i+1)+'사이클 · '+c.reduce((a,b)=>a+Number(b.plannedAmount||b.s||0),0).toLocaleString()+'kg</h3>'+c.map(b=>{let size=Number(b.plannedAmount||b.s||0),water=Number(b.actualWater??b.water??size*base),mix=Number(b.actualMix??b.mix??(size===250?4:5)),wait=Number(b.hopperWait??b.wait??0),ret=b.actualRetarder||b.ret||'미사용';return '<div class="batch"><div><small>회차</small><b>'+(b.round||'')+'차</b></div><div><small>투입량</small><b>'+size+'kg</b></div><div><small>실제 수분</small><b>'+water.toFixed(1)+'L</b></div><div><small>실제 믹싱</small><b>'+mix+'분</b></div><div><small>호퍼 대기</small><b>'+wait+'분</b></div><div><small>지연제 사용</small><b class="'+(ret==='사용'?'ret-use':'')+'">'+ret+'</b></div></div>'}).join('')+'</div>').join('')+'<div class="notice"><b>작업 결과:</b> '+r.outcome+'<br><b>특이사항:</b> '+r.memo+'</div><div class="edit-box"><label>작업 결과</label><select id="editOutcome"><option '+(r.outcome==='정상 작업 완료'?'selected':'')+'>정상 작업 완료</option><option '+(r.outcome==='조건 변경 후 완료'?'selected':'')+'>조건 변경 후 완료</option><option '+(r.outcome==='품질 이상 발생'?'selected':'')+'>품질 이상 발생</option></select><label>지연제 사용 여부</label><select id="editRetarder"><option '+(r.retarder==='미사용'?'selected':'')+'>미사용</option><option '+(r.retarder!=='미사용'?'selected':'')+'>사용</option></select><label>특이사항</label><textarea id="editMemo">'+r.memo+'</textarea><button class="edit-save" onclick="saveEditDetail()">저장</button></div>'}let detailRecord=null;function openEditDetail(){let b=document.querySelector('.edit-open');if(b)b.style.display='none';let e=document.querySelector('.edit-box');if(e)e.style.display='block'};function saveEditDetail(){if(!detailRecord)return;detailRecord.outcome=document.getElementById('editOutcome').value;detailRecord.retarder=document.getElementById('editRetarder').value;detailRecord.memo=document.getElementById('editMemo').value;historyEdits[historyKey(detailRecord)]={outcome:detailRecord.outcome,retarder:detailRecord.retarder,memo:detailRecord.memo};localStorage.setItem('historyEdits',JSON.stringify(historyEdits));groups();list();detail(detailRecord)}groups();list()</script></body></html>
