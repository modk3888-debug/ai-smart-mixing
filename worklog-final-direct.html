<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작업일지 및 특이사항</title><style>body{margin:0;background:#f6f8fb;color:#10243b;font-family:Arial,"Malgun Gothic",sans-serif}header{background:#fff;border-bottom:1px solid #dce3eb;padding:23px 5%;font-size:21px;font-weight:bold;color:#082b50}main{width:min(1000px,92vw);margin:40px auto}.top{display:flex;gap:15px;align-items:center}.top a{color:#1761b7;text-decoration:none}.card{background:#fff;border:1px solid #d2dce7;border-radius:10px;padding:21px;margin-top:18px}.facts{display:grid;grid-template-columns:1fr 1.35fr 1fr 1fr 1fr;gap:10px}.fact{background:#f6f8fb;padding:14px;border-radius:8px;min-width:0}.fact small,label{display:block;color:#718196;font-size:11px;margin-bottom:7px}.fact b{font-size:17px;line-height:1.35;overflow-wrap:anywhere;word-break:keep-all}.batch{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:15px;border-bottom:1px solid #e7edf2;align-items:end}.batch input,.batch select,textarea{width:100%;padding:10px;border:1px solid #d2dce7;border-radius:7px;box-sizing:border-box;font:inherit}textarea{height:90px;resize:vertical}button{width:100%;padding:14px;background:#082b50;color:#fff;border:0;border-radius:7px;font-weight:bold;margin-top:15px;cursor:pointer}.saved{display:none;position:fixed;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);z-index:20;width:128px;text-align:center;background:#fff;color:#087f68;padding:13px 12px;border-radius:10px;box-shadow:0 8px 22px rgba(20,60,70,.18);font-weight:700;font-size:15px;border:1px solid #c9eee3}.saved:before{content:'✓';display:inline-grid;place-items:center;width:24px;height:24px;margin-right:6px;border-radius:50%;background:#e2f8f0;color:#087f68;font-size:15px;vertical-align:-5px}.round-note{padding:7px 15px 9px;border-bottom:1px solid #e7edf2;background:#fbfcfe}.round-note label{font-size:10px;margin-bottom:3px}.round-note textarea{margin-top:3px;height:48px;padding:7px;font-size:13px}@media(max-width:800px){.facts{grid-template-columns:repeat(2,1fr)}.card{overflow:auto}.batch{min-width:760px}}@media(max-width:450px){.facts{grid-template-columns:1fr}}</style></head><body><header><div class="top"><b>AI 스마트 믹싱 · 작업일지 및 특이사항</b><a href="dashboard-final-direct.html">대시보드로 돌아가기</a></div></header><main><h1>작업일지 작성하기</h1><div class="card"><div class="facts"><div class="fact"><small>작업명</small><b id="name">—</b></div><div class="fact"><small>내화물 종류</small><b id="material">—</b></div><div class="fact"><small>계획 투입량</small><b id="plan">—</b></div><div class="fact"><small>작업장 온도</small><b id="temperature">—</b>℃</div><div class="fact"><small>상대습도</small><b id="humidity">—</b>%</div></div><div id="batches"></div><label style="margin-top:16px">작업 결과</label><select id="outcome" style="width:100%;padding:10px;border:1px solid #d2dce7;border-radius:7px"><option>정상 작업 완료</option><option>조건 변경 후 완료</option><option>품질 이상 발생</option></select><label style="margin-top:13px">전체 특이사항</label><textarea id="memo" placeholder="전체 작업 특이사항을 입력하세요."></textarea><button id="save" onclick="document.getElementById('saved').style.display='block';document.getElementById('saved').textContent='저장완료';setTimeout(()=>document.getElementById('saved').style.display='none',1000)">작업일지 저장</button><div class="saved" id="saved">저장완료</div></div></main><script>let w=JSON.parse(localStorage.getItem('currentWork')||'null')||{n:'래들 벽체',m:'저시멘트 캐스터블',a:2500,recommended:[]},$=id=>document.getElementById(id);$('name').textContent=w.n;$('material').textContent=w.m;$('plan').textContent=w.a.toLocaleString()+'kg';$('temperature').textContent=w.temperature??'자동 감지';$('humidity').textContent=w.humidity??'자동 감지';let base=w.m.includes('고알루미나')?.045:w.m.includes('마그네시아')?.065:.052,rs=(w.recommended||[]).map(r=>({...r,water:r.water??r.s*base,mix:r.mix??(r.s===250?4:5)}));if(!rs.length){let rem=w.a;while(rem>0){let s=Math.min(500,rem);rs.push({s,water:s*base,mix:s===250?4:5,ret:'미사용'});rem-=s}}$('batches').innerHTML=rs.map((r,i)=>'<div class="batch"><div><b>'+(i+1)+'차</b><br>'+r.s+'kg</div><div><label>실제 수분</label><input class="water" value="'+r.water.toFixed(1)+'"></div><div><label>실제 믹싱</label><input class="mix" value="'+r.mix+'"></div><div><label>호퍼 대기 / 위험도</label><b>'+(r.wait??0)+'분 / '+(r.risk??'-')+'%</b></div><div><label>AI 추천 지연제</label><b>'+r.ret+'</b></div><div><label>실제 지연제</label><select class="ret"><option '+(r.ret==='미사용'?'selected':'')+'>미사용</option><option '+(r.ret==='사용'?'selected':'')+'>사용</option></select></div></div><div class="round-note"><label>'+(i+1)+'차 특이사항</label><textarea class="roundNote" placeholder="'+(i+1)+'차 작업 특이사항을 입력하세요."></textarea></div>').join('');$('save').onclick=()=>{let logs=JSON.parse(localStorage.getItem('mixingLogs')||'[]');let batches=rs.map((r,i)=>{let row=document.querySelectorAll('.batch')[i];return{round:i+1,plannedAmount:r.s,actualWater:parseFloat(row.querySelector('.water').value)||0,actualMix:parseFloat(row.querySelector('.mix').value)||0,hopperWait:r.wait??0,aiRetarder:r.ret,actualRetarder:row.querySelector('.ret').value}});logs.unshift({date:new Date().toISOString().slice(0,10),worker:'작업일지 입력',job:w.n,material:w.m,amount:w.a,temperature:w.temperature,humidity:w.humidity,outcome:$('outcome').value,retarder:batches.map(x=>x.actualRetarder).join(', '),batches,memo:[...document.querySelectorAll('.roundNote')].map((x,i)=>x.value?(i+1)+'차: '+x.value:'').filter(Boolean).concat($('memo').value?['전체: '+$('memo').value]:[]).join(' / ')});localStorage.setItem('mixingLogs',JSON.stringify(logs));$('saved').style.display='block';setTimeout(()=>$('saved').style.display='none',1000)}</script></body></html>
