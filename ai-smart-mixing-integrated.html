            message.textContent = scopeApproved ? 'AI 추천 완료 · 작업자 승인 대기 중입니다.' : '부적합 사진 · 학습 반영을 차단했습니다.';
            name.textContent = `학습 데이터 등록: ${localFile.name}`;
            button.disabled = false;
            input.value = '';
            return;
          }

          button.disabled = true;
          message.style.display = 'block';
          message.style.color = '#2871af';
          message.textContent = 'AI가 사진의 내화물 범위를 확인하는 중입니다.';
          try {
            const body = new FormData();
            body.append('file', file, file.name);
            const analysisUrl = window.location.port === '8765' ? 'http://127.0.0.1:8000/analyze' : '/analyze';
            const response = await fetch(analysisUrl, {method: 'POST', body});
            if (!response.ok) throw new Error('AI 판정 서버에 연결되지 않았습니다.');
            const analysis = await response.json();
            const feature = analysis.feature_summary || {};
            const documentLike = Number(feature.bright_ratio) >= 0.45 && Number(feature.edge_density) <= 0.14;
            if (analysis.image_scope !== true || documentLike) {
              message.style.color = '#ca4858';
              message.textContent = `분석 중단 · ${analysis.analysis_result || '내화물 현장 사진이 아닙니다.'}`;
              name.textContent = '분석 대상이 아닌 사진입니다.';
              return;
            }
            const job = panel.querySelector('#photoJob').value;
            const cycle = panel.querySelector('#photoCycle').value;
            const round = panel.querySelector('#photoRound').value;
            const item = document.createElement('div');
            item.className = 'learn-item open';
            item.dataset.learningApproved = 'true';
            item.innerHTML = `<button class="learn-title" type="button"><b>${job} · ${cycle} ${round} · 현장 업로드 이미지</b><span>접기</span></button><div class="learn-detail"><div class="image-layout"><img class="uploaded-image" alt="업로드된 현장 이미지"><div><div class="detail-grid"><div class="detail"><small>작업명</small><b>${job}</b></div><div class="detail"><small>사이클 · 차수</small><b>${cycle} · ${round}</b></div><div class="detail"><small>분석 상태</small><b class="green">${analysis.analysis_status || '시범 판정 완료'}</b></div></div><div class="improve"><b>AI 판정 결과</b><br>경화 의심도 ${analysis.hardening_score ?? '-'}% · 균열 의심도 ${analysis.crack_score ?? '-'}%<br>${analysis.improvement_note || ''}</div></div></div></div>`;
            item.querySelector('.uploaded-image').src = window.aiSmartMixingSelectedPreview || URL.createObjectURL(file);
            item.querySelector('.learn-title').addEventListener('click', () => {
              item.classList.toggle('open');
              item.querySelector('.learn-title span').textContent = item.classList.contains('open') ? '접기' : '펼치기';
            });
            learning.querySelector('.learn-list').prepend(item);
            message.style.color = '#108b65';
            message.textContent = `AI 판정 완료 · 경화 의심도 ${analysis.hardening_score ?? '-'}% · 균열 의심도 ${analysis.crack_score ?? '-'}%`;
            name.textContent = `등록 완료: ${file.name}`;
          } catch (error) {
            message.style.color = '#ca4858';
            message.textContent = `등록 중단 · ${error.message}`;
          } finally {
            button.disabled = false;
          }
        }, true);
      };
      install();
      document.querySelectorAll('nav button[data-screen]').forEach((button) => {
        button.addEventListener('click', () => {
          const target = document.getElementById(button.dataset.screen);
          if (!target) return;
          document.querySelectorAll('.screen').forEach((screen) => screen.classList.remove('active'));
          target.classList.add('active');
          install();
        });
      });
      window.addEventListener('hashchange', install);
    })();
  </script>

<script>
(function(){
  const root=document.getElementById('process'); if(!root||true)return; root.dataset.steelSim='1';
  root.innerHTML='<div class="steel-sim"><div class="ss-head"><div><div class="ss-kicker">SMART STEEL PROCESS / SIMULATION</div><h1>제철 공정을 실시간으로 확인하세요.</h1><p>제선·제강·압연의 공개된 일반 공정 흐름을 기반으로 공정 상태와 센서값을 확인하는 데모입니다.</p></div><div class="ss-status">● 시뮬레이션 연결됨</div></div><div class="ss-steps"><button class="ss-step active" data-n="0"><small>PROCESS 01</small><b>제선</b><span>원료 장입 · 환원 · 쇳물 생산</span></button><button class="ss-step" data-n="1"><small>PROCESS 02</small><b>제강</b><span>정련 · 성분 조정 · 연속 주조</span></button><button class="ss-step" data-n="2"><small>PROCESS 03</small><b>압연</b><span>가열 · 압연 · 품질 확인</span></button></div><div class="ss-body"><div class="ss-panel"><h2 id="ssTitle">제선 공정 모니터</h2><p id="ssDesc">원료를 장입하고 환원 반응을 통해 쇳물을 생산합니다.</p><div class="ss-machine"><i class="ss-pipe a"></i><i class="ss-pipe b"></i><i class="ss-pipe c"></i><label id="ssMachine">BLAST FURNACE / RAW MATERIAL FLOW</label></div><div class="ss-metrics"><div class="ss-metric"><small>공정 온도</small><strong class="ss-orange" id="ssTemp">1,180℃</strong></div><div class="ss-metric"><small>설비 부하</small><strong class="ss-cyan" id="ssLoad">72%</strong></div><div class="ss-metric"><small>진행률</small><strong class="ss-green" id="ssProgress">38%</strong></div><div class="ss-metric"><small>AI 상태</small><strong class="ss-green" id="ssAi">정상</strong></div></div><div class="ss-buttons"><button class="ss-button" id="ssNext">다음 공정 시뮬레이션</button><button class="ss-button alt" id="ssReset">처음부터</button></div><div class="ss-result" id="ssResult">AI 판단: 현재 제선 공정은 정상 범위입니다. 다음 단계 진행을 준비할 수 있습니다.</div></div><div class="ss-panel"><h2>공정 흐름</h2><p>공개된 일반 공정 흐름 기반의 발표용 시뮬레이션</p><div class="ss-timeline"><div class="ss-event"><b>01</b><div><strong>제선</strong><span>원료를 장입하고 환원 반응으로 쇳물을 생산합니다.</span></div></div><div class="ss-event"><b>02</b><div><strong>제강</strong><span>쇳물의 온도와 성분을 조정한 뒤 연속 주조합니다.</span></div></div><div class="ss-event"><b>03</b><div><strong>압연</strong><span>슬래브를 가열·압연하여 제품 규격을 확인합니다.</span></div></div></div><div class="ss-result">실제 PLC를 제어하지 않는 발표용 시뮬레이션입니다.</div></div></div></div>';
  const data=[['제선 공정 모니터','원료를 장입하고 환원 반응을 통해 쇳물을 생산합니다.','1,180℃','72%','38%','BLAST FURNACE / RAW MATERIAL FLOW','AI 판단: 현재 제선 공정은 정상 범위입니다. 다음 단계 진행을 준비할 수 있습니다.'],['제강 공정 모니터','쇳물의 온도와 성분을 조정하고 연속 주주를 진행합니다.','1,624℃','64%','66%','LADLE / CONTINUOUS CASTING','AI 판단: 성분 조정 단계가 안정적으로 진행 중입니다. 온도 편차를 계속 관찰합니다.'],['압연 공정 모니터','슬래브를 가열하고 압연하여 최종 제품을 생산합니다.','1,080℃','81%','91%','REHEATING FURNACE / ROLLING MILL','AI 판단: 압연 하중이 관리 범위 안에 있습니다. 제품 품질 확인 단계로 이동합니다.']]; let cur=0;
  function render(n){cur=n;const d=data[n];root.querySelectorAll('.ss-step').forEach((b,i)=>b.classList.toggle('active',i===n));['ssTitle','ssDesc','ssTemp','ssLoad','ssProgress','ssMachine','ssResult'].forEach((id,i)=>root.querySelector('#'+id).textContent=d[i]);root.querySelector('#ssNext').textContent=n===2?'시뮬레이션 완료':'다음 공정 시뮬레이션'}
  root.querySelectorAll('.ss-step').forEach(b=>b.addEventListener('click',()=>render(Number(b.dataset.n))));root.querySelector('#ssNext').addEventListener('click',()=>render(cur<2?cur+1:0));root.querySelector('#ssReset').addEventListener('click',()=>render(0));
})();
</script>
  <script>
    // 학습 후보 등록·승인 흐름을 단일 이벤트로 처리합니다.
    (function () {
      const addButton = document.getElementById('addLearningPhoto');
      const demoButton = document.getElementById('loadDemoPhoto');
      const input = document.getElementById('learningPhotoInput');
      const list = document.querySelector('#learning .learn-list');
      const message = document.getElementById('photoUploadMessage');
      const fileName = document.getElementById('learningPhotoName');
      if (!addButton || !list) return;

      function selectedFile() {
        return (input && input.files && input.files[0]) || window.aiSmartMixingDemoFile || null;
      }

      function addCandidate(file) {
        const job = document.getElementById('photoJob')?.value || '래들 벽체';
        const cycle = document.getElementById('photoCycle')?.value || '1사이클';
        const round = document.getElementById('photoRound')?.value || '1차';
        const previewSrc = window.aiSmartMixingSelectedPreview || (file ? URL.createObjectURL(file) : 'learning-ladle-wall.jpg');
        const item = document.createElement('div');
        item.className = 'learn-item open';
        item.dataset.learningData = 'true';
        item.innerHTML = `<button class="learn-title" type="button"><b></b><span>접기</span></button>
          <div class="learn-detail"><div class="image-layout"><img class="uploaded-image" alt="업로드한 학습 이미지">
          <div><div class="detail-grid"><div class="detail"><small>작업명</small><b class="candidate-job"></b></div>
          <div class="detail"><small>사이클 · 차수</small><b class="candidate-round"></b></div>
          <div class="detail"><small>분석 상태</small><b class="green review-status">AI 분석 완료 · 학습 후보</b></div></div>
          <p><b>AI 분석 결과</b><br>등록된 사진의 표면 상태를 확인했습니다. 작업자가 결과를 검토한 뒤 학습 반영 여부를 결정할 수 있습니다.</p>
          <div class="improve"><b>개선 사안</b><br>작업 조건과 사진 상태를 함께 확인한 후 승인하면 학습 데이터에 반영됩니다.
          <div class="learning-review-actions"><button type="button" data-learning-approve>학습 반영</button><button type="button" class="button secondary" data-learning-reject>제외</button></div></div>
          </div></div></div>`;
        item.querySelector('.learn-title b').textContent = `${job} · ${cycle} ${round} · 학습 검토 이미지`;
        item.querySelector('.candidate-job').textContent = job;
        item.querySelector('.candidate-round').textContent = `${cycle} · ${round}`;
        item.querySelector('.uploaded-image').src = previewSrc;
        item.querySelector('.learn-title').addEventListener('click', () => {
          item.classList.toggle('open');
          item.querySelector('.learn-title span').textContent = item.classList.contains('open') ? '접기' : '펼치기';
        });
        item.querySelector('[data-learning-approve]').addEventListener('click', (event) => {
          event.stopPropagation();
          item.querySelector('.review-status').textContent = '학습 반영 완료';
          item.querySelector('.learning-review-actions').remove();
          if (message) { message.style.display = 'block'; message.style.color = '#108b65'; message.textContent = '학습 반영 완료'; }
        });
        item.querySelector('[data-learning-reject]').addEventListener('click', (event) => {
          event.stopPropagation();
          item.remove();
          if (message) { message.style.display = 'block'; message.style.color = '#b04747'; message.textContent = '학습 데이터에서 제외했습니다.'; }
        });
        list.prepend(item);
        if (message) { message.style.display = 'block'; message.style.color = '#108b65'; message.textContent = 'AI 분석 완료 · 학습 후보가 등록되었습니다.'; }
        return item;
      }

      if (demoButton) {
        demoButton.addEventListener('click', async () => {
          if (window.aiSmartMixingDemoFile) return;
          try {
            const response = await fetch('learning-ladle-wall.jpg', { cache: 'no-store' });
            if (!response.ok) throw new Error('demo image unavailable');
            const blob = await response.blob();
            window.aiSmartMixingDemoFile = new File([blob], 'refractory-demo.jpg', { type: blob.type || 'image/jpeg' });
            window.aiSmartMixingSelectedPreview = URL.createObjectURL(blob);
            if (fileName) fileName.textContent = '공개 데모 사진 선택됨 · 래들 벽체';
            const preview = document.getElementById('learningPhotoPreview');
            const empty = document.getElementById('learningPhotoEmpty');
            if (preview) { preview.src = window.aiSmartMixingSelectedPreview; preview.style.display = 'block'; }
            if (empty) empty.style.display = 'none';
          } catch (_) {
            if (fileName) fileName.textContent = '데모 사진을 불러오지 못했습니다.';
          }
        });
      }

      addButton.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        const file = selectedFile();
        if (!file) { if (fileName) fileName.textContent = '먼저 현장 사진 파일을 선택하세요.'; return; }
        addCandidate(file);
      });
    })();
  </script>
